# Runs the frontend and the backend. Kubernetes and Prometheus stay OUTSIDE Docker Compose.
#
# Before `docker compose up --build`:
#   1. .\scripts\start-port-forwards.ps1 -ListenAll      (Prometheus 9091, Jaeger 16686)
#   2. .\scripts\make-docker-kubeconfig.ps1              (writes .kube-docker\config)
#   3. copy .env.example .env  and fill in LLM_API_KEY
#
# Open http://localhost:8080 (dashboard) and http://localhost:8000/docs (API).
services:
  backend:
    build: ./backend
    env_file: .env
    environment:
      # Inside a container 127.0.0.1 is the container itself; host.docker.internal is your PC.
      PROMETHEUS_URL: http://host.docker.internal:9091
      JAEGER_URL: http://host.docker.internal:16686/jaeger
      KUBECONFIG: /home/app/.kube/config
      CORS_ORIGINS: http://localhost:8080
    volumes:
      # Only the backend gets the (minified, read-only) kubeconfig. The frontend gets no credentials.
      - ./.kube-docker/config:/home/app/.kube/config:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
    restart: unless-stopped
