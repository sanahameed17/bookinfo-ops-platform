server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API calls go to the backend container (service name "backend" in compose.yaml).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 180s;   # the AI agent can take up to ~1-2 minutes
    }

    # React Router: every other path returns index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
